[project]
name = "grade-report"
version = "0.1.0"
description = "Анализатор успеваемости"
authors = [
    {name = "Кумич Анна Александровна",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "rich (>=15.0.0,<16.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
packages = [{include = "grade_report"}]

[dependency-groups]
dev = [
    "pyinstaller (>=6.22.3,<7.0.0)"
]
